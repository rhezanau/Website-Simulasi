<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Lihat Nilai Siswa</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
    }

    .box {
      border: 2px dashed #ccc;
      padding: 15px;
      width: fit-content;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.05);
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 10px;
    }

    th, td {
      border: 1px dashed #bbb;
      padding: 8px;
    }

    .nilai {
      color: orange;
      font-weight: bold;
      text-align: center;
    }

    th {
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>

  <h2>11. Lihat Nilai (Siswa)</h2>
  <div class="box">
    <div><strong>| LIHAT NILAI SISWA |</strong></div>
    <table>
      <thead>
        <tr>
          <th>Mapel</th>
          <th>Nilai</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Pemrograman Dasar</td>
          <td class="nilai">85</td>
        </tr>
        <tr>
          <td>PKK</td>
          <td class="nilai">90</td>
        </tr>
        <tr>
          <td>...</td>
          <td>...</td>
        </tr>
      </tbody>
    </table>
  </div>

</body>
</html>

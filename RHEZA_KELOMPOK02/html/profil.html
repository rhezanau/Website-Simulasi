<head>

      padding: 20px;
    }

    .box {
      border: 2px dashed #ccc;

    }

      padding: 4px 12px;
      background-color: #eee;
      border: 1px solid #aaa;
      cursor: pointer;
    }
  </style>
</head>
<body>

    <p>Kelas: <span class="kelas">XI PPLG 1</span></p>

</html>

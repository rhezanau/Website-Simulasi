<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pengumuman Terbaru</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
    }

    .box {
      border: 2px dashed #5ecb90;
      padding: 15px;
      width: fit-content;
    }

    .pengumuman {
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px dashed #ccc;
    }

    .tanggal {
      color: brown;
    }

    .judul {
      font-weight: bold;
    }

    .isi {
      color: #c58e00;
    }
  </style>
</head>
<body>
  <h2>12. Pengumuman</h2>
  <div class="box">
    <div><strong>| PENGUMUMAN TERBARU |</strong></div>
    <div class="pengumuman">
      <p>[<span class="tanggal">10 April 2025</span>]</p>
      <p>Judul: <span class="judul">Ujian Akhir Semester</span></p>
      <p>Isi: <span class="isi">Dimulai 20 April 2025</span></p>
    </div>
    <div class="pengumuman">
      <p>[<span class="tanggal">08 April 2025</span>]</p>
      <p>Judul: <span class="judul">Libur Nasional</span></p>
      <p>...</p>
    </div>
  </div>
</body>
</html>
